[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "omnis"

[project]
name = "omnis-api"
version = "0.1.0"
description = "Local Omnis control-plane API"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "alembic==1.20.0",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "greenlet==3.5.6",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "openai==2.24.0",
    "jsonschema==4.26.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "SQLAlchemy==2.0.54",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "sniffio==1.3.1",
    "tqdm==4.67.3",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["src", "../integrations/hermes/src"]
markers = ["legacy_native: explicit historical native execution or retained-private provenance"]

[tool.ruff]
required-version = "==0.16.9"
target-version = "py313"
line-length = 100
src = ["api/src", "api/tests"]
respect-gitignore = false
unsafe-fixes = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/src",
    "$MYPY_CONFIG_FILE_DIR/tests",
    "$MYPY_CONFIG_FILE_DIR/../integrations/hermes/src",
]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
