# P0 disposable test DB: no network; private UDS under an operator-owned 0700 parent.
name: ${OMNIS_TEST_PROJECT:?Set a unique omnis-p01-test project name}
services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    platform: linux/amd64
    pull_policy: never
    user: "${OMNIS_TEST_UID:?Explicit test UID required}:${OMNIS_TEST_GID:?Explicit test GID required}"
    environment:
      POSTGRES_USER: omnis_test
      POSTGRES_DB: omnis_test
      POSTGRES_PASSWORD_FILE: /run/omnis-db-password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - postgres
      - -c
      - listen_addresses=
      - -c
      - unix_socket_directories=/var/run/postgresql
      - -c
      - unix_socket_permissions=0600
    volumes:
      - type: bind
        source: ${OMNIS_TEST_DATA_DIR:?Explicit disposable data directory required}
        target: /var/lib/postgresql # PG18 PGDATA: /var/lib/postgresql/18/docker
        bind:
          create_host_path: false
      - type: bind
        source: ${OMNIS_TEST_SOCKET_DIR:?Explicit private socket directory required}
        target: /var/run/postgresql
        bind:
          create_host_path: false
      - type: bind
        source: ${OMNIS_TEST_PASSWORD_FILE:?Explicit disposable password file required}
        target: /run/omnis-db-password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql", "-U", "omnis_test", "-d", "omnis_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
