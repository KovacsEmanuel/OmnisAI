name: P0 control checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-and-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install locked test environments
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.19
          uv sync --locked --no-config --no-python-downloads --python 3.13.15 --directory api --group dev
          python -m venv "$RUNNER_TEMP/omnis-docs"
          "$RUNNER_TEMP/omnis-docs/bin/python" -m pip install -r documents/requirements-docs.txt
          npm --prefix tools/development/anti-slop ci --include=dev --ignore-scripts --no-fund
          npm --prefix web ci --include=dev --ignore-scripts --no-fund
      - name: Verify Python lint, formatting and strict types before provisioning
        run: make lint-api typecheck-api
      - name: Run the local gate against a dedicated PostgreSQL instance
        run: |
          set -euo pipefail
          export TMPDIR="$HOME/.cache/omnis-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$TMPDIR"
          export OMNIS_TEST_PROJECT="omnis-p01-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export OMNIS_TEST_DB_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(28))')"
          trap 'docker compose -f ops/compose.test.yaml down' EXIT
          docker compose -f ops/compose.test.yaml up -d --wait db
          port="$(docker compose -f ops/compose.test.yaml port db 5432)"
          export OMNIS_TEST_DATABASE_URL="postgresql+psycopg://omnis_test:${OMNIS_TEST_DB_PASSWORD}@${port}/omnis_test"
          PATH="$RUNNER_TEMP/omnis-docs/bin:$PATH" make check
