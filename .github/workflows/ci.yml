name: P0 control checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-and-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install locked test environments
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.19
          uv sync --locked --no-config --no-python-downloads --python 3.13.15 --directory api --group dev
          uv sync --locked --no-config --no-python-downloads --python 3.13.15 --directory cli
          python -m venv "$RUNNER_TEMP/omnis-docs"
          "$RUNNER_TEMP/omnis-docs/bin/python" -m pip install -r documents/requirements-docs.txt
          npm --prefix tools/development/anti-slop ci --include=dev --ignore-scripts --no-fund
          npm --prefix web ci --include=dev --ignore-scripts --no-fund
          web/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify Python lint, formatting and strict types before provisioning
        run: make lint-api typecheck-api
      - name: Run the local gate against a dedicated PostgreSQL instance
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$HOME/.cache/omnis-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$TMPDIR"
          # Explicit prerequisite; the gate itself never pulls or adopts an old DB.
          docker pull --platform linux/amd64 postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
          capture_status=0
          outer_log=$(mktemp "$TMPDIR/ci-outer.XXXXXXXX" 2>/dev/null) || capture_status=$?
          set +e
          PATH="$RUNNER_TEMP/omnis-docs/bin:$PATH" make check | tee --output-error=warn -- "$outer_log" 2>/dev/null
          statuses=("${PIPESTATUS[@]}")
          set -e
          gate_status=${statuses[0]}
          if [ "$capture_status" -eq 0 ]; then capture_status=${statuses[1]}; fi
          if [ "$capture_status" -ne 0 ]; then
            printf '%s\n' '::error::Gate diagnostics unavailable; private log not published (outer-capture-failed)'
            if [ "$gate_status" -eq 0 ]; then gate_status=$capture_status; fi
          elif [ "$gate_status" -ne 0 ]; then
            python -I -B scripts/ci_gate_diagnostics.py "$TMPDIR" "$outer_log" 2>/dev/null || printf '%s\n' '::error::Gate diagnostics unavailable; private log not published (reporter-failed)'
          fi
          exit "$gate_status"
