[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "omnis"

[project]
name = "omnis-api"
version = "0.1.0"
description = "Local Omnis control-plane API"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "greenlet==3.5.6",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "SQLAlchemy==2.0.54",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
