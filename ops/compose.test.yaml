# P0 test DB only: explicit host loopback, no Docker-published port or operator data.
name: ${OMNIS_TEST_PROJECT:?Set a unique omnis-p01-test project name}
services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    platform: linux/amd64
    environment:
      POSTGRES_USER: omnis_test
      POSTGRES_DB: omnis_test
      POSTGRES_PASSWORD: ${OMNIS_TEST_DB_PASSWORD:?Set a disposable test password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    network_mode: host
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=${OMNIS_TEST_DB_PORT:?Set a free dedicated loopback port}
    volumes:
      - pgdata:/var/lib/postgresql # PG18 PGDATA: /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "${OMNIS_TEST_DB_PORT:?Set a dedicated loopback port}", "-U", "omnis_test", "-d", "omnis_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
volumes:
  pgdata:
